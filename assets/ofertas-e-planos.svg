<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Onde o GitLab roda × o que cada plano oferece">
<title>Onde o GitLab roda × o que cada plano oferece</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="920" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Onde o GitLab roda × o que cada plano oferece</text>
<rect x="30" y="70" width="270" height="150" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="165.0" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">☁️ GitLab.com</text>
<text x="165.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">SaaS multi-inquilino</text>
<text x="165.0" y="134" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">você só usa; GitLab opera</text>
<text x="165.0" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">runners compartilhados</text>
<rect x="325" y="70" width="270" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="460.0" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🏠 Self-Managed</text>
<text x="460.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">você instala (Omnibus,</text>
<text x="460.0" y="134" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Docker, Helm) e opera</text>
<text x="460.0" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">CE grátis e aberto (MIT)</text>
<rect x="620" y="70" width="270" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="755.0" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🏢 Dedicated</text>
<text x="755.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">instância só sua,</text>
<text x="755.0" y="134" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">operada pela GitLab</text>
<text x="755.0" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">(empresas, compliance)</text>
<rect x="30" y="245" width="860" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="267" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Free</text>
<text x="160" y="267" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">400 min CI/mês no .com · 5 usuários por grupo privado</text>
<rect x="30" y="287" width="860" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="309" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Premium</text>
<text x="160" y="309" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">aprovações obrigatórias, code owners, push rules, merge trains</text>
<rect x="30" y="329" width="860" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="351" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Ultimate</text>
<text x="160" y="351" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">segurança completa (DAST, painéis), compliance, push protection</text>
<text x="896" y="386" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
