<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Anatomia de um pipeline do GitLab CI/CD">
<title>Anatomia de um pipeline do GitLab CI/CD</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="960" height="470" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Anatomia de um pipeline do GitLab CI/CD</text>
<rect x="30" y="70" width="180" height="110" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="120.0" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">⚡ gatilho</text>
<text x="120.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">push, MR, tag,</text>
<text x="120.0" y="134" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">agendamento, API</text>
<text x="120.0" y="152" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">$CI_PIPELINE_SOURCE</text>
<rect x="240" y="70" width="180" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="330.0" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">📄 .gitlab-ci.yml</text>
<text x="330.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">na raiz do projeto</text>
<text x="330.0" y="134" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">stages + jobs</text>
<text x="330.0" y="152" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">workflow:rules</text>
<rect x="450" y="60" width="150" height="230" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="525" y="82" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0f172a">stage: build</text>
<rect x="465" y="100" width="120" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="525" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">compilar</text>
<rect x="615" y="60" width="150" height="230" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="690" y="82" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0f172a">stage: test</text>
<rect x="630" y="100" width="120" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="690" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">unitarios</text>
<rect x="630" y="170" width="120" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="690" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">lint</text>
<rect x="780" y="60" width="150" height="230" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="855" y="82" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0f172a">stage: deploy</text>
<rect x="795" y="100" width="120" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="855" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">staging</text>
<path d="M210 125 L238 125" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<path d="M420 125 L448 125" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<path d="M585 126 L613 126" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<path d="M750 126 L778 126" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<path d="M750 196 C 772 196, 778 150, 793 132" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#s)"/>
<text x="690" y="250" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600" fill="#0f172a">needs: (DAG)</text>
<rect x="30" y="320" width="900" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="346" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🏃 GitLab Runner — executa cada job num ambiente limpo (container, VM, shell)</text>
<text x="480.0" y="366" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">jobs do mesmo stage rodam em paralelo; stages em sequência; needs: pula a fila</text>
<text x="480.0" y="384" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">artefatos passam arquivos entre jobs; cache acelera dependências</text>
<text x="480.0" y="402" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">image: · script: · rules: · artifacts: · cache: · needs: · environment:</text>
<text x="936" y="456" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
