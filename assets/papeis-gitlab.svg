<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="Papéis no GitLab: cada degrau inclui o anterior">
<title>Papéis no GitLab: cada degrau inclui o anterior</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="920" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Papéis no GitLab: cada degrau inclui o anterior</text>
<rect x="20" y="240" width="140" height="105" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="90.0" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Guest</text>
<text x="90.0" y="286" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">vê e comenta</text>
<text x="90.0" y="304" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">(issues em privados)</text>
<rect x="168" y="208" width="140" height="105" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
<text x="238.0" y="234" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Planner</text>
<text x="238.0" y="254" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">planeja: issues,</text>
<text x="238.0" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">épicos, boards</text>
<rect x="316" y="176" width="140" height="105" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
<text x="386.0" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Reporter</text>
<text x="386.0" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">lê o código,</text>
<text x="386.0" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">vê pipelines</text>
<rect x="464" y="144" width="140" height="105" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="534.0" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Developer</text>
<text x="534.0" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">push em branches</text>
<text x="534.0" y="208" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">não protegidas, MRs</text>
<rect x="612" y="112" width="140" height="105" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="682.0" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Maintainer</text>
<text x="682.0" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">configura o projeto,</text>
<text x="682.0" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">branches protegidas</text>
<rect x="760" y="80" width="140" height="105" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="830.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Owner</text>
<text x="830.0" y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">tudo: membros,</text>
<text x="830.0" y="144" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">apagar, transferir</text>
<text x="460" y="365" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Na API, os papéis são números: Guest 10 · Planner 15 · Reporter 20 · Developer 30 · Maintainer 40 · Owner 50.</text>
<text x="896" y="390" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
