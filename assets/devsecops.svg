<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="DevSecOps no GitLab: os scanners entram no pipeline">
<title>DevSecOps no GitLab: os scanners entram no pipeline</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="960" height="360" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DevSecOps no GitLab: os scanners entram no pipeline</text>
<rect x="25" y="90" width="140" height="120" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="95.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🔐 segredos</text>
<text x="95.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Secret Detection</text>
<text x="95.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">push protection</text>
<path d="M165 150 L183 150" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<rect x="183" y="90" width="140" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="253.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🧪 código</text>
<text x="253.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">SAST</text>
<text x="253.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">(semgrep, etc.)</text>
<path d="M323 150 L341 150" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<rect x="341" y="90" width="140" height="120" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="411.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">📦 dependências</text>
<text x="411.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Dependency</text>
<text x="411.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Scanning</text>
<path d="M481 150 L499 150" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<rect x="499" y="90" width="140" height="120" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
<text x="569.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🐳 container</text>
<text x="569.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Container</text>
<text x="569.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Scanning</text>
<path d="M639 150 L657 150" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<rect x="657" y="90" width="140" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="727.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🌐 app rodando</text>
<text x="727.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">DAST</text>
<text x="727.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">(Ultimate)</text>
<path d="M797 150 L815 150" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<rect x="815" y="90" width="140" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="885.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">📋 licenças</text>
<text x="885.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">License</text>
<text x="885.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Compliance</text>
<text x="480" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">include: template: Jobs/SAST.gitlab-ci.yml — uma linha liga um scanner. Os resultados saem como relatórios do job;</text>
<text x="480" y="275" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">no Ultimate eles aparecem no MR, no painel de vulnerabilidades e podem bloquear o merge por política.</text>
<text x="480" y="315" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">E o próprio pipeline é superfície de ataque: imagens sem versão, includes remotos sem integridade, variáveis sem proteção.</text>
<text x="936" y="346" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
