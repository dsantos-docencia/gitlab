# Curso de GitLab — verificação do próprio curso num espelho do GitLab.
# Faz o mesmo que .github/workflows/verificar.yml, com as práticas do curso:
# imagem com versão fixa, um pipeline por mudança, ferramentas em versão fixa.
# © 2026 Prof. Daniel Santos · PolyForm-NC
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

verificar:
  image: python:3.13-slim-trixie
  timeout: 30m
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git jq shellcheck curl >/dev/null
    - pip install --quiet pyyaml check-jsonschema==0.39.0 actionlint-py==1.7.12.25 zizmor==1.32.0
    - git config --global user.name "CI" && git config --global user.email "ci@exemplo.invalid"
    - git config --global init.defaultBranch main
  script:
    - ./ferramentas/verificar-tudo.sh
